<style>
:root{--bd:#004368;--tl:#016f90;--tll:#19a68e;--cy:#22b8d1;--cy2:#1298ba;--lime:#E4EC6F;--grad:linear-gradient(135deg,#004368 0%,#016f90 55%,#19a68e 100%);--ink:#0B2A3A;--mu:#556F7E;--line:#D6E7EC;--ok:#1F9D6B;--wa:#E8A317;--er:#D64545;--sh:0 8px 30px rgba(1,111,144,.12);--shl:0 18px 44px rgba(1,80,110,.18)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 6% -4%,#cdeef6 0,transparent 60%),radial-gradient(800px 520px at 100% 8%,#e3f6ec 0,transparent 55%),#F3FAFC fixed;overflow-x:hidden}
h1,h2,h3,.f{font-family:'Plus Jakarta Sans',system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tll);outline-offset:2px}[hidden]{display:none!important}
.w{max-width:1200px;margin:0 auto;padding:0 20px}.card{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:22px;transition:box-shadow .2s,transform .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:99px;font-weight:700;background:var(--tl);color:#fff;transition:transform .15s,opacity .15s,box-shadow .15s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(1,111,144,.22)}.btn.dk{background:var(--bd)}.btn.wh{background:#fff;color:var(--bd)}.btn.ol{background:none;border:2px solid #fff}.btn.lt{background:#e3f1f5;color:var(--bd)}.btn.lime{background:var(--lime);color:#06364f}.btn.sm{min-height:38px;padding:0 16px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.bdg{background:var(--lime);color:#27400a;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;display:inline-block;letter-spacing:.04em}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.tg.ok{background:#d9f3e8;color:#0f6b46}.tg.wa{background:#fdf0cf;color:#8a5b00}.tg.lk{background:#fbe0e0;color:#a02c2c}
.chip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);padding:6px 13px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:16px}.chip.dk{background:#e3f6fa;color:var(--bd);border-color:#bfe8f1}
/* header */
.top{position:sticky;top:10px;z-index:50;margin:10px auto 0;max-width:1200px;padding:0 20px}
.nv{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:99px;padding:7px 10px 7px 10px;box-shadow:var(--sh)}
.lg{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bd);line-height:1.1}.lg b{font:800 17px 'Plus Jakarta Sans',system-ui,sans-serif;display:block}.lg small{display:block;font-size:11px;color:var(--mu);font-weight:600}
.logo{width:42px;height:42px;border-radius:12px;display:block;flex:none}
.nv nav{display:flex;gap:16px;font-weight:600;font-size:14px;margin-left:auto}.nv nav a{color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:3px solid transparent;white-space:nowrap}.nv nav a.on{border-color:var(--cy);color:var(--tl)}
.hb{display:none;width:44px;height:44px;border-radius:50%;background:#e3f6fa;color:var(--bd);font-size:20px}.um{position:relative}.umm{position:absolute;right:0;top:50px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:8px;width:200px}.umm button,.umm a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}.umm button:hover,.umm a:hover{background:#eaf6f9}
/* hero ala layar awal app */
.hero2{position:relative;margin-top:14px;border-radius:32px;overflow:hidden;color:#fff;min-height:440px;background:linear-gradient(160deg,#04527c 0%,#0a78a6 48%,#33b9d2 100%)}

q(e){if(!need())return;const h=HUB[+e.dataset.v],n=DB.qu.length+1;DB.qu.push({id:'A-'+String(n).padStart(2,'0'),u:DB.me,h:h.n,t:Date.now()});save();toast(`Nomor antrean A-${String(n).padStart(2,'0')} di ${h.n}. Estimasi tunggu 6 menit.`)},
bk(e){if(!need())return;const x=UN.find(u=>u.id===e.dataset.v),b=addD(R.a,R.n-1);mdl(`<h2 class="f">Konfirmasi sewa</h2><p><b>${x.n}</b><br>${fmt(R.a)} – ${fmt(b)} (${R.n} hari)<br>Total <b>${rp(x.p*R.n)}</b></p><form data-f="bk" data-u="${x.id}" style="display:grid;gap:10px"><label class="f2">Nomor SIM C<input name="s" required minlength="10" inputmode="numeric" autocomplete="off"></label><label class="f2">Pembayaran<select name="m"><option>QRIS</option><option>Transfer bank syariah</option><option>E-wallet</option></select></label><label class="chk"><input type="checkbox" name="ok" required>Saya menyetujui syarat dan ketentuan sewa</label><div class="er" id="er" role="alert"></div><button class="btn">Bayar ${rp(x.p*R.n)}</button></form><button class="btn lt" data-a="x">Batal</button>`)},
fin(e){mdl(`<h2 class="f">Selesaikan sewa</h2><form data-f="fin" data-id="${e.dataset.v}" style="display:grid;gap:10px"><label class="f2">Jarak yang ditempuh (km)<input name="k" type="number" min="0" max="1000" required></label><p class="mut">Jarak dipakai untuk menghitung penghematan Anda.</p><button class="btn">Selesaikan</button></form><button class="btn lt" data-a="x">Batal</button>`)},
bp(e){if(!need())return;const p=PK[+e.dataset.v];mdl(`<h2 class="f">${p[0]}</h2><p>${p[1]}<br>Total <b>${rp(p[2])}</b></p><form data-f="bp" data-i="${e.dataset.v}" style="display:grid;gap:10px"><label class="f2">Pembayaran<select name="m"><option>QRIS</option><option>Transfer bank syariah</option><option>E-wallet</option></select></label><button class="btn">Bayar ${rp(p[2])}</button></form><button class="btn lt" data-a="x">Batal</button>`)},
od(){if(!need())return;const items=Object.entries(C.c).filter(x=>x[1]>0),all=KS.flatMap(x=>x.m),tot=items.reduce((s,[n,q])=>s+q*all.find(m=>m[0]===n)[1],0),u=me(),v=Math.min(u.vc||0,tot);u.vc=(u.vc||0)-v;const o={id:uid('JG'),u:DB.me,items:items.map(([n,q])=>q+'× '+n).join(', '),tot,mo:$('#mo').value,t:Date.now()};DB.od.push(o);C.c={};save();route();mdl(`<h2 class="f">Pesanan diterima</h2><div class="code">${o.id}</div><p>${o.items}</p><p class="mut">Dibayar ${rp(tot-v)}${v?` + voucher ${rp(v)}`:''} · ${o.mo}. Status diperbarui otomatis di halaman Akun.</p><button class="btn" data-a="x">Selesai</button>`)},
cs(){if(!need())return;const c=$('#ch').value,k=+$('#kw').value,s={id:uid('S'),u:DB.me,c,kwh:k,cost:k*TAR,t:Date.now(),dur:k/22*36e5};DB.ss.push(s);save();route();toast('Sesi dimulai. Biaya '+rp(s.cost)+'.')},
sv(e){if(!me())return;DB.sv[DB.me]=e.dataset.v;save();route();toast('Terima kasih atas jawaban Anda.')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){ACT[t.dataset.a]&&ACT[t.dataset.a](t);return}
const ub=e.target.closest('#ub');if(ub){const m=$('#umm');m.hidden=!m.hidden;ub.setAttribute('aria-expanded',!m.hidden);return}if(!e.target.closest('#umm'))$('#umm')&&($('#umm').hidden=true)});
document.addEventListener('change',e=>{const c=e.target.dataset.ch;if(!c)return;const v=e.target.type==='checkbox'?e.target.checked:e.target.value;if(c==='dur')F.dur=+v;if(c==='veh')F.veh=v;if(c==='free')F.free=v;if(c==='ra')R.a=v<T0?T0:v;if(c==='rn')R.n=+v;route()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cls()});
$('#md').addEventListener('click',e=>{if(e.target.id==='md')cls()});
$('#hb').onclick=()=>{const o=$('#nav').classList.toggle('o');$('#hb').setAttribute('aria-expanded',o)};
const er=m=>{const x=$('#er');x&&(x.textContent=m)};
document.addEventListener('submit',async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
if(f==='up'){const em=d.e.trim().toLowerCase();if(DB.users.find(u=>u.id===em))return er('Email sudah terdaftar. Silakan masuk.');if(d.t==='Mitra Hub'&&d.k!==MITRA_CODE)return er('Kode akses mitra tidak valid.');DB.users.push({id:em,n:d.n.trim(),e:em,h:d.h,t:d.t,h2:await sha(d.p),vc:0});DB.me=em;save();cls();route();toast('Akun dibuat. Selamat datang, '+d.n.split(' ')[0]+'!')}
if(f==='in'){await seedDemo();const em=d.e.trim().toLowerCase(),u=DB.users.find(x=>x.id===em);if(!u||u.h2!==await sha(d.p))return er('Email atau password salah.');DB.me=em;save();cls();route();toast('Selamat datang kembali, '+u.n.split(' ')[0]+'!')}
if(f==='bk'){const x=UN.find(u=>u.id===e.target.dataset.u),b=addD(R.a,R.n-1);if(avail(x,R.a,b)<1)return er('Stok untuk tanggal ini sudah habis.');const k={id:uid('SW'),u:DB.me,m:x.id,mn:x.n,a:R.a,b,total:x.p*R.n,st:'Aktif',pay:d.m,t:Date.now()};DB.bk.push(k);save();route();mdl(`<h2 class="f">Sewa berhasil</h2><p class="mut">Tunjukkan kode ini ke operator di titik jemput.</p><div class="code">${k.id}</div><p><b>${x.n}</b><br>${fmt(k.a)} – ${fmt(k.b)}<br>Titik jemput: Hub Gampong · Sentra Wisata, Charger AC-01<br>Serah terima: foto kondisi unit dan persen baterai, dikonfirmasi operator dan Anda.</p><button class="btn" data-a="x">Selesai</button>`)}
if(f==='fin'){const k=DB.bk.find(x=>x.id===e.target.dataset.id);k.st='Selesai';k.km=+d.k;save();cls();route();toast('Sewa selesai. Penghematan Anda: '+rp(k.km*KMR))}
if(f==='bp'){const p=PK[+e.target.dataset.i],u=me(),r={id:uid('HP'),u:DB.me,n:p[0],price:p[2],d:T0};u.vc=(u.vc||0)+p[3];DB.ps.push(r);DB.bk.push({id:uid('SW'),u:DB.me,m:'A',mn:'Motor Listrik Wisata A (Hub Pass)',a:T0,b:addD(T0,p[4]-1),total:0,st:'Aktif',pay:'Hub Pass',t:Date.now()});save();route();mdl(`<h2 class="f">Hub Pass aktif</h2><div class="code">${r.id}</div><p>${p[1]}.<br>Voucher kios ${rp(p[3])} sudah masuk saldo dan dipakai otomatis di Jajan Gampong.</p><button class="btn" data-a="x">Selesai</button>`)}});
addEventListener('hashchange',route);route();
